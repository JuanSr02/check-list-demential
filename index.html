<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Plantilla</title>
  <meta name="description" content="Checklist diaria con plantilla editable y subítems.">
  <meta name="theme-color" content="#F2F5F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1415" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Plantilla">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Aplica el último tema antes de mostrar la página (evita un parpadeo de color).
    try {
      var t = JSON.parse(localStorage.getItem('plantilla.themevars'));
      if (t) { var r = document.documentElement.style;
        r.setProperty('--bg', t.bg); r.setProperty('--surface', t.surface); r.setProperty('--ink', t.ink);
        r.setProperty('--muted', t.muted); r.setProperty('--line', t.line); r.setProperty('--accent', t.accent);
        r.setProperty('--accent-ink', t.accentInk); r.setProperty('--accent-soft', t.accentSoft); }
    } catch (e) {}
  </script>
</head>
<body>
  <main id="app" class="wrap"></main>
  <noscript>Plantilla necesita JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
